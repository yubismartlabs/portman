name: Release unsigned macOS test build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "PortMan $GITHUB_REF_NAME"

  bundle:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Verify updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }}
      - name: Upload unsigned DMG and updater artifacts to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          UPDATER_ASSET="PortMan_${{ matrix.target }}.app.tar.gz"
          cp "$BUNDLE_DIR/macos/PortMan.app.tar.gz" "$UPDATER_ASSET"
          cp "$BUNDLE_DIR/macos/PortMan.app.tar.gz.sig" "$UPDATER_ASSET.sig"
          gh release upload "$GITHUB_REF_NAME" "$BUNDLE_DIR"/dmg/*.dmg "$UPDATER_ASSET" "$UPDATER_ASSET.sig" --clobber

  publish-updater-manifest:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "PortMan_*.app.tar.gz.sig"
      - name: Create static updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-updater-manifest.mjs
      - name: Upload updater manifest to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
